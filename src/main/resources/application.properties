spring.application.name=modulith-scaffold-mcp

# --- MCP server (stdio transport) ---
spring.ai.mcp.server.name=modulith-scaffold-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.stdio=true

# --- IMPORTANT for stdio ---
# The client talks to this process over stdout. Anything else printed there
# (the Spring banner, console logs) corrupts the protocol and the connection fails.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=
logging.file.name=target/mcp-server.log
